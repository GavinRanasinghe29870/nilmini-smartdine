services:
  redis:
    image: redis:7-alpine
    container_name: nilmini-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nilmini-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-api:
    image: nilmini-ml-api:dev
    build:
      context: ./backend/services/nilmini_ml_api
    container_name: nilmini-ml-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./backend/services/nilmini_ml_api/daily_product_sales_history_wide.csv:/app/daily_product_sales_history_wide.csv
      - ./backend/services/nilmini_ml_api/product_demand_forecast_training_dataset.csv:/app/product_demand_forecast_training_dataset.csv
    networks:
      - nilmini-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  demand-dataset-updater:
    image: nilmini-ml-api:dev
    container_name: nilmini-demand-dataset-updater
    restart: unless-stopped
    environment:
      TZ: Asia/Colombo
      ORDER_SERVICE_URL: http://order-service:5006
      ML_API_URL: http://ml-api:8001
      DEMAND_DATASET_UPDATE_TIME: "23:10"
      RUN_DEMAND_UPDATE_ON_START: "false"
      ALLOW_DEV_FALLBACK_ON_EMPTY: "false"
    command: ["python", "scripts/scheduler.py"]
    depends_on:
      ml-api:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - nilmini-network

  customer-preference-api:
    build:
      context: ./backend/services/nilmini_customer_preference_api
    container_name: nilmini-customer-preference-api
    restart: unless-stopped
    environment:
      TZ: Asia/Colombo
      ORDER_SERVICE_URL: http://order-service:5006
    ports:
      - "8002:8002"
    volumes:
      - ./backend/services/nilmini_customer_preference_api/models:/app/models
      - ./backend/services/nilmini_customer_preference_api/data:/app/data
      - ./backend/services/nilmini_customer_preference_api/outputs:/app/outputs
    depends_on:
      order-service:
        condition: service_started
    networks:
      - nilmini-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  customer-preference-retrainer:
    build:
      context: ./backend/services/nilmini_customer_preference_api
    container_name: nilmini-customer-preference-retrainer
    restart: unless-stopped
    environment:
      TZ: Asia/Colombo
      ORDER_SERVICE_URL: http://order-service:5006
      RUN_RETRAIN_ON_START: "false"
      AGGREGATE_TIME: "23:15"
      PREFERENCE_ANALYZE_TIME: "23:20"
      RETRAIN_DAYS: "mon,thu"
      RETRAIN_TIME: "23:30"
    command: ["python", "scripts/scheduler.py"]
    volumes:
      - ./backend/services/nilmini_customer_preference_api/models:/app/models
      - ./backend/services/nilmini_customer_preference_api/data:/app/data
      - ./backend/services/nilmini_customer_preference_api/outputs:/app/outputs
    depends_on:
      order-service:
        condition: service_started
      customer-preference-api:
        condition: service_healthy
    networks:
      - nilmini-network

  auth-service:
    build:
      context: ./backend/services/auth-service
    container_name: nilmini-auth-service
    restart: unless-stopped
    env_file:
      - ./backend/services/auth-service/.env
    environment:
      PORT: 5001
      REDIS_URL: redis://redis:6379
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nilmini-network

  staff-service:
    build:
      context: ./backend/services/staff-service
    container_name: nilmini-staff-service
    restart: unless-stopped
    env_file:
      - ./backend/services/staff-service/.env
    environment:
      PORT: 5002
      AUTH_SERVICE_URL: http://auth-service:5001
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5002:5002"
    depends_on:
      - auth-service
    networks:
      - nilmini-network

  inventory-service:
    build:
      context: ./backend/services/inventory-service
    container_name: nilmini-inventory-service
    restart: unless-stopped
    env_file:
      - ./backend/services/inventory-service/.env
    environment:
      PORT: 5003
      FRONTEND_UPLOAD_DIR: /shared/frontend-uploads
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ./frontend/public/uploads:/shared/frontend-uploads
    ports:
      - "5003:5003"
    networks:
      - nilmini-network

  product-service:
    build:
      context: ./backend/services/product-service
    container_name: nilmini-product-service
    restart: unless-stopped
    env_file:
      - ./backend/services/product-service/.env
    environment:
      PORT: 5004
      FRONTEND_UPLOAD_DIR: /shared/frontend-uploads
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ./frontend/public/uploads:/shared/frontend-uploads
    ports:
      - "5004:5004"
    networks:
      - nilmini-network

  ai-menu-service:
    build:
      context: ./backend/services/ai-menu-service
    container_name: nilmini-ai-menu-service
    restart: unless-stopped
    env_file:
      - ./backend/services/ai-menu-service/.env
    environment:
      PORT: 5005
      ML_API_URL: http://ml-api:8001
      PRODUCT_SERVICE_URL: http://product-service:5004
      INVENTORY_SERVICE_URL: http://inventory-service:5003
      ORDER_SERVICE_URL: http://order-service:5006
      CUSTOMER_PREFERENCE_API_URL: http://customer-preference-api:8002
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
      PREFERENCE_ADJUSTMENT_MIN_UNITS: "10"
      PREFERENCE_ADJUSTMENT_MAX_UNITS: "15"
    ports:
      - "5005:5005"
    depends_on:
      ml-api:
        condition: service_healthy
      customer-preference-api:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - nilmini-network

  order-service:
    build:
      context: ./backend/services/order-service
    container_name: nilmini-order-service
    restart: unless-stopped
    env_file:
      - ./backend/services/order-service/.env
    environment:
      PORT: 5006
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5006:5006"
    networks:
      - nilmini-network

  report-service:
    build:
      context: ./backend/services/report-service
    container_name: nilmini-report-service
    restart: unless-stopped
    environment:
      PORT: 5007
      ORDER_SERVICE_URL: http://order-service:5006
      PRODUCT_SERVICE_URL: http://product-service:5004
      INVENTORY_SERVICE_URL: http://inventory-service:5003
      STAFF_SERVICE_URL: http://staff-service:5002
      AI_MENU_SERVICE_URL: http://ai-menu-service:5005
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5007:5007"
    depends_on:
      order-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      staff-service:
        condition: service_started
      ai-menu-service:
        condition: service_started
    networks:
      - nilmini-network

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: nilmini-api-gateway
    restart: unless-stopped
    env_file:
      - ./backend/api-gateway/.env
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      STAFF_SERVICE_URL: http://staff-service:5002
      INVENTORY_SERVICE_URL: http://inventory-service:5003
      PRODUCT_SERVICE_URL: http://product-service:5004
      AI_MENU_SERVICE_URL: http://ai-menu-service:5005
      ORDER_SERVICE_URL: http://order-service:5006
      REPORT_SERVICE_URL: http://report-service:5007
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
      FRONTEND_UPLOAD_DIR: /shared/frontend-uploads
    volumes:
      - ./frontend/public/uploads:/shared/frontend-uploads
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - staff-service
      - inventory-service
      - product-service
      - ai-menu-service
      - order-service
      - report-service
    networks:
      - nilmini-network

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_UPLOAD_PROXY_URL: http://api-gateway:5000
    container_name: nilmini-frontend
    restart: unless-stopped
    environment:
      INTERNAL_UPLOAD_PROXY_URL: http://api-gateway:5000
    volumes:
      - ./frontend/public/uploads:/app/public/uploads
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - nilmini-network

networks:
  nilmini-network:
    driver: bridge