services:
  redis:
    image: redis:7-alpine
    container_name: nilmini-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nilmini-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-api:
    build:
      context: ./backend/services/nilmini_ml_api
    container_name: nilmini-ml-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - nilmini-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./backend/services/auth-service
    container_name: nilmini-auth-service
    restart: unless-stopped
    env_file:
      - ./backend/services/auth-service/.env
    environment:
      PORT: 5001
      REDIS_URL: redis://redis:6379
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nilmini-network

  staff-service:
    build:
      context: ./backend/services/staff-service
    container_name: nilmini-staff-service
    restart: unless-stopped
    env_file:
      - ./backend/services/staff-service/.env
    environment:
      PORT: 5002
      AUTH_SERVICE_URL: http://auth-service:5001
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5002:5002"
    depends_on:
      - auth-service
    networks:
      - nilmini-network

  inventory-service:
    build:
      context: ./backend/services/inventory-service
    container_name: nilmini-inventory-service
    restart: unless-stopped
    env_file:
      - ./backend/services/inventory-service/.env
    environment:
      PORT: 5003
      FRONTEND_UPLOAD_DIR: /shared/frontend-uploads
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ./frontend/public/uploads:/shared/frontend-uploads
    ports:
      - "5003:5003"
    networks:
      - nilmini-network

  product-service:
    build:
      context: ./backend/services/product-service
    container_name: nilmini-product-service
    restart: unless-stopped
    env_file:
      - ./backend/services/product-service/.env
    environment:
      PORT: 5004
      FRONTEND_UPLOAD_DIR: /shared/frontend-uploads
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ./frontend/public/uploads:/shared/frontend-uploads
    ports:
      - "5004:5004"
    networks:
      - nilmini-network

  ai-menu-service:
    build:
      context: ./backend/services/ai-menu-service
    container_name: nilmini-ai-menu-service
    restart: unless-stopped
    env_file:
      - ./backend/services/ai-menu-service/.env
    environment:
      PORT: 5005
      ML_API_URL: http://ml-api:8001
      PRODUCT_SERVICE_URL: http://product-service:5004
      INVENTORY_SERVICE_URL: http://inventory-service:5003
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5005:5005"
    depends_on:
      ml-api:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - nilmini-network

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: nilmini-api-gateway
    restart: unless-stopped
    env_file:
      - ./backend/api-gateway/.env
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      STAFF_SERVICE_URL: http://staff-service:5002
      INVENTORY_SERVICE_URL: http://inventory-service:5003
      PRODUCT_SERVICE_URL: http://product-service:5004
      AI_MENU_SERVICE_URL: http://ai-menu-service:5005
      FRONTEND_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
      FRONTEND_UPLOAD_DIR: /shared/frontend-uploads
    volumes:
      - ./frontend/public/uploads:/shared/frontend-uploads
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - staff-service
      - inventory-service
      - product-service
      - ai-menu-service
    networks:
      - nilmini-network

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_UPLOAD_PROXY_URL: http://api-gateway:5000
    container_name: nilmini-frontend
    restart: unless-stopped
    environment:
      INTERNAL_UPLOAD_PROXY_URL: http://api-gateway:5000
    volumes:
      - ./frontend/public/uploads:/app/public/uploads
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - nilmini-network

networks:
  nilmini-network:
    driver: bridge